<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>台灣氣象與防災儀表板</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#0f172a"/>
  <meta name="mobile-web-app-capable" content="yes"/>

  <!-- Apple PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="台灣氣象"/>
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #0f172a;
      font-family: -apple-system, 'Noto Sans TC', sans-serif;
      overflow: hidden;
      padding:
        env(safe-area-inset-top, 0px)
        env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px)
        env(safe-area-inset-left, 0px);
    }

    /* ── Splash ── */
    .splash {
      position: fixed; inset: 0; z-index: 9999;
      background: #0f172a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 24px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    .splash.hidden { opacity: 0; visibility: hidden; }

    .splash-icon {
      width: 100px; height: 100px;
      border-radius: 24px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.08),
                  0 0 40px rgba(14,165,233,0.35);
    }
    .splash-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .splash-title {
      color: #f1f5f9; font-size: 1.2rem; font-weight: 800;
      letter-spacing: -0.02em; text-align: center;
    }
    .splash-sub {
      color: #475569; font-size: 0.72rem;
      text-transform: uppercase; letter-spacing: 0.12em; text-align: center;
    }
    .dots { display: flex; gap: 8px; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #0ea5e9; animation: bounce 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay:.16s; background:#6366f1; }
    .dot:nth-child(3) { animation-delay:.32s; background:#34d399; }
    @keyframes bounce {
      0%,80%,100% { transform:translateY(0); opacity:.5; }
      40%          { transform:translateY(-10px); opacity:1; }
    }

    /* ── App Shell ── */
    .app-shell { display:flex; flex-direction:column; width:100%; height:100%; }

    /* PWA 頂欄（僅 standalone 顯示） */
    .topbar {
      display: none;
      align-items: center; justify-content: space-between;
      height: 44px; padding: 0 16px; flex-shrink: 0;
      background: #0f172a;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    @media all and (display-mode: standalone) { .topbar { display: flex; } }

    .topbar-left { display:flex; align-items:center; gap:10px; }
    .topbar-icon {
      width:28px; height:28px; border-radius:7px; overflow:hidden;
      box-shadow: 0 0 8px rgba(14,165,233,0.3);
    }
    .topbar-icon img { width:100%; height:100%; object-fit:cover; display:block; }
    .topbar-title { color:#f1f5f9; font-size:0.88rem; font-weight:700; }

    .topbar-right { display:flex; align-items:center; gap:8px; }
    .live-dot {
      width:7px; height:7px; border-radius:50%;
      background:#34d399; box-shadow:0 0 6px #34d399;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(.8); }
    }
    .clock { font-size:0.78rem; color:#64748b; font-variant-numeric:tabular-nums; }

    /* 離線橫幅 */
    .offline-bar {
      display: none; align-items:center; justify-content:center;
      gap:8px; height:32px; flex-shrink:0;
      background: rgba(239,68,68,0.12);
      border-bottom: 1px solid rgba(239,68,68,0.25);
      color: #fca5a5; font-size:0.75rem; font-weight:600;
    }
    .offline-bar.show { display:flex; }

    /* iframe */
    .frame-wrap { flex:1; position:relative; overflow:hidden; }
    iframe {
      position:absolute; inset:0;
      width:100%; height:100%;
      border:none; background:#0f172a;
    }

    /* ── Android 安裝提示 ── */
    .install-toast {
      display: none;
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom, 20px));
      left: 50%; transform: translateX(-50%);
      z-index: 1000;
      background: #1e293b;
      border: 1px solid rgba(14,165,233,0.3);
      border-radius: 18px; padding: 16px 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      width: min(calc(100vw - 32px), 340px);
      animation: slideUp .3s cubic-bezier(.34,1.56,.64,1);
    }
    .install-toast.show { display: block; }
    @keyframes slideUp {
      from { transform:translateX(-50%) translateY(16px); opacity:0; }
      to   { transform:translateX(-50%) translateY(0);    opacity:1; }
    }
    .toast-row { display:flex; align-items:center; gap:12px; }
    .toast-ico { width:44px; height:44px; border-radius:11px; overflow:hidden; flex-shrink:0; }
    .toast-ico img { width:100%; height:100%; object-fit:cover; display:block; }
    .toast-name { font-size:.9rem; font-weight:700; color:#f1f5f9; }
    .toast-desc { font-size:.72rem; color:#64748b; margin-top:2px; }
    .toast-btns { display:flex; gap:8px; margin-top:12px; }
    .btn-add {
      flex:1; padding:10px; border:none; border-radius:10px; cursor:pointer;
      background: linear-gradient(135deg,#0ea5e9,#6366f1);
      color:#fff; font-size:.85rem; font-weight:700;
    }
    .btn-add:active { opacity:.8; }
    .btn-skip {
      padding:10px 14px; border-radius:10px; cursor:pointer;
      border:1px solid rgba(255,255,255,0.08);
      background:transparent; color:#64748b; font-size:.82rem;
    }

    /* ── iOS 安裝指引 ── */
    .ios-sheet {
      display: none;
      position: fixed; bottom:0; left:0; right:0; z-index:1000;
      background: #1e293b;
      border-top: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px 20px 0 0;
      padding: 0 24px max(24px, env(safe-area-inset-bottom, 24px));
      box-shadow: 0 -20px 60px rgba(0,0,0,0.5);
      animation: sheetUp .3s ease;
    }
    .ios-sheet.show { display: block; }
    @keyframes sheetUp {
      from { transform:translateY(20px); opacity:0; }
      to   { transform:translateY(0);    opacity:1; }
    }
    .sheet-handle {
      width:36px; height:4px; border-radius:2px;
      background:rgba(255,255,255,0.12); margin:12px auto 16px;
    }
    .sheet-title {
      font-size:1rem; font-weight:800; color:#f1f5f9;
      text-align:center; margin-bottom:20px;
    }
    .sheet-preview {
      display: flex; align-items:center; gap:12px;
      background: rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.06);
      border-radius:14px; padding:12px 16px; margin-bottom:20px;
    }
    .preview-ico { width:52px; height:52px; border-radius:13px; overflow:hidden; flex-shrink:0; }
    .preview-ico img { width:100%; height:100%; object-fit:cover; display:block; }
    .preview-name { font-size:.92rem; font-weight:700; color:#f1f5f9; }
    .preview-url  { font-size:.72rem; color:#64748b; margin-top:2px; }

    .steps { display:flex; flex-direction:column; gap:14px; }
    .step  { display:flex; align-items:center; gap:12px; }
    .step-num {
      width:28px; height:28px; border-radius:50%; flex-shrink:0;
      background: linear-gradient(135deg,#0ea5e9,#6366f1);
      color:#fff; font-size:.8rem; font-weight:700;
      display:flex; align-items:center; justify-content:center;
    }
    .step-text { font-size:.875rem; color:#cbd5e1; line-height:1.45; }
    .step-text strong { color:#f1f5f9; }
    .step-text .share-icon {
      display:inline-block;
      background:rgba(14,165,233,0.15); border:1px solid rgba(14,165,233,0.3);
      border-radius:6px; padding:1px 7px; font-size:.75rem; color:#38bdf8;
      vertical-align:middle; margin:0 2px;
    }

    .close-btn {
      width:100%; margin-top:20px; padding:12px;
      border:1px solid rgba(255,255,255,0.08); border-radius:12px;
      background:transparent; color:#64748b; font-size:.88rem; cursor:pointer;
    }
  </style>
</head>
<body>

<!-- Splash -->
<div class="splash" id="splash">
  <div class="splash-icon">
    <img src="icons/icon-192x192.png" alt="台灣氣象"/>
  </div>
  <div>
    <div class="splash-title">台灣氣象與防災儀表板</div>
    <div class="splash-sub" style="margin-top:6px;">Taiwan Weather Dashboard</div>
  </div>
  <div class="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
</div>

<!-- App -->
<div class="app-shell">

  <div class="offline-bar" id="offline-bar">⚠️ 目前離線，資料可能非最新</div>

  <!-- 頂欄（standalone 才顯示） -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-icon"><img src="icons/icon-192x192.png" alt=""/></div>
      <span class="topbar-title">台灣氣象儀表板</span>
    </div>
    <div class="topbar-right">
      <div class="live-dot"></div>
      <span class="clock" id="clock"></span>
    </div>
  </div>

  <!-- Streamlit iframe -->
  <div class="frame-wrap">
    <iframe
      id="app-frame"
      src="https://weather2026-mha6sx5bsvvfs5l9t6cpne.streamlit.app?embedded=true"
      title="台灣氣象與防災儀表板"
      allow="geolocation"
      loading="lazy">
    </iframe>
  </div>

</div>

<!-- Android 安裝提示 -->
<div class="install-toast" id="install-toast">
  <div class="toast-row">
    <div class="toast-ico"><img src="icons/icon-192x192.png" alt=""/></div>
    <div>
      <div class="toast-name">台灣氣象儀表板</div>
      <div class="toast-desc">加入主畫面，像 App 一樣使用</div>
    </div>
  </div>
  <div class="toast-btns">
    <button class="btn-add" id="btn-add">📲 加入主畫面</button>
    <button class="btn-skip" id="btn-skip">稍後</button>
  </div>
</div>

<!-- iOS 安裝指引 -->
<div class="ios-sheet" id="ios-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">📲 加入主畫面</div>
  <div class="sheet-preview">
    <div class="preview-ico"><img src="icons/icon-192x192.png" alt=""/></div>
    <div>
      <div class="preview-name">台灣氣象儀表板</div>
      <div class="preview-url">muimikka-design.github.io/Weather2026</div>
    </div>
  </div>
  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-text">點 Safari 底部工具列的 <span class="share-icon">⬆ 分享</span> 按鈕</div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div class="step-text">在選單中選擇 <strong>「加入主畫面」</strong></div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div class="step-text">右上角點 <strong>「新增」</strong>，圖示會出現在桌面 ✅</div>
    </div>
  </div>
  <button class="close-btn" id="ios-close">我知道了</button>
</div>

<script>
// Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { scope: '/Weather2026/' })
      .then(r => console.log('SW OK:', r.scope))
      .catch(e => console.warn('SW fail:', e));
  });
}

// Clock
function tick() {
  const n = new Date();
  const t = String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
  const el = document.getElementById('clock');
  if (el) el.textContent = t;
}
tick(); setInterval(tick, 30000);

// Hide splash after iframe load (max 10s)
const splash = document.getElementById('splash');
const frame  = document.getElementById('app-frame');
let t = setTimeout(() => splash.classList.add('hidden'), 10000);
frame.addEventListener('load', () => {
  clearTimeout(t);
  setTimeout(() => splash.classList.add('hidden'), 600);
});

// Offline
const offlineBar = document.getElementById('offline-bar');
function syncOnline() { offlineBar.classList.toggle('show', !navigator.onLine); }
window.addEventListener('online',  syncOnline);
window.addEventListener('offline', syncOnline);
syncOnline();

// Android install prompt
let deferredPrompt = null;
const toast   = document.getElementById('install-toast');
const btnAdd  = document.getElementById('btn-add');
const btnSkip = document.getElementById('btn-skip');

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  if (!sessionStorage.getItem('install-skip')) {
    setTimeout(() => toast.classList.add('show'), 3500);
  }
});
btnAdd.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  toast.classList.remove('show');
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
});
btnSkip.addEventListener('click', () => {
  toast.classList.remove('show');
  sessionStorage.setItem('install-skip', '1');
});
window.addEventListener('appinstalled', () => {
  toast.classList.remove('show');
  deferredPrompt = null;
});

// iOS install guide
const iosSheet = document.getElementById('ios-sheet');
const iosClose = document.getElementById('ios-close');
const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = window.matchMedia('(display-mode: standalone)').matches
                  || navigator.standalone === true;

if (isIos && !isStandalone && !sessionStorage.getItem('ios-shown')) {
  setTimeout(() => {
    iosSheet.classList.add('show');
    sessionStorage.setItem('ios-shown', '1');
  }, 4000);
}
iosClose.addEventListener('click', () => iosSheet.classList.remove('show'));
document.addEventListener('click', e => {
  if (iosSheet.classList.contains('show') && !iosSheet.contains(e.target))
    iosSheet.classList.remove('show');
});
</script>
</body>
</html>
